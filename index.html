<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maya Dwi Latifah | Software QA</title>
<meta name="description" content="Portofolio Maya Dwi Latifah, Software Quality Assurance (Manual, API, UAT).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   GANTI WARNA DI SINI. Cukup ubah kode warna (#xxxxxx) di bawah ini.
   --brand  = warna utama (tombol, link, garis timeline)
   --accent = warna pemanis (garis bawah judul, bingkai foto)
   --navy   = warna judul besar
   Bagian pertama untuk mode terang, bagian kedua (dark) untuk mode gelap.
   ===================================================================== */
:root{
  --bg:#f2f5f9; --card:#ffffff; --text:#1a2635; --muted:#5d6c7f;
  --brand:#2f5f93; --accent:#9cc3e3; --navy:#0e2339; --line:#dce5ee;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0a111a; --card:#111b27; --text:#e4ebf3; --muted:#91a2b6;
        --brand:#7db0e3; --accent:#3d6a94; --navy:#d3e5f8; --line:#213245}
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:64px}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:var(--brand)}
a:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}
nav{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;gap:4px 22px;flex-wrap:wrap;justify-content:center;padding:12px 20px}
nav a{text-decoration:none;color:var(--muted);font-size:14px;font-weight:500}
nav a:hover{color:var(--brand)}
section{max-width:980px;margin:0 auto;padding:56px 22px}
h2,h1,.serif{font-family:Newsreader,Georgia,"Times New Roman",serif}
h2{font-size:32px;font-weight:600;margin:0 0 26px;color:var(--navy);letter-spacing:-.01em}
h2::after{content:"";display:block;width:44px;height:3px;background:var(--accent);margin-top:10px;border-radius:2px}

/* HERO */
.hero{display:flex;gap:44px;align-items:center;flex-wrap:wrap;padding-top:80px;padding-bottom:40px}
.hero .txt{flex:1 1 360px}
.hero h1{font-size:clamp(40px,7vw,64px);font-weight:600;margin:0;color:var(--navy);line-height:1.05;letter-spacing:-.02em}
.role{color:var(--brand);font-weight:500;margin:12px 0 18px;font-size:17px}
.hero p{max-width:60ch;color:var(--muted);margin:0}
.photo{width:210px;height:210px;border-radius:50%;border:2px solid var(--accent);padding:6px;background:var(--card);object-fit:cover;flex:none;display:flex;align-items:center;justify-content:center;font:600 64px Newsreader,Georgia,serif;color:var(--brand)}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.btn{display:inline-block;padding:10px 22px;border-radius:999px;background:var(--brand);color:var(--bg);text-decoration:none;font-weight:600;font-size:14px;border:2px solid var(--brand);transition:background .2s,color .2s}
.btn:hover{background:transparent;color:var(--brand)}
.btn.o{background:transparent;color:var(--brand)}
.btn.o:hover{background:var(--brand);color:var(--bg)}

/* TIMELINE (pengalaman, urut dari terbaru) */
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:28px}
.job{position:relative;padding-bottom:34px}
.job:last-child{padding-bottom:0}
.job::before{content:"";position:absolute;left:-37px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:3px solid var(--brand)}
.job h3{margin:0;font-size:20px;font-family:Newsreader,Georgia,serif;color:var(--navy)}
.job .co{margin:2px 0 0;color:var(--brand);font-weight:500;font-size:15px}
.job .when{color:var(--muted);font-size:13.5px;margin:0 0 6px}
.job .about{color:var(--muted);font-size:14px;font-style:italic;margin:0 0 8px}
.job ul{margin:6px 0 0;padding-left:18px;font-size:15px}
.job li{margin-bottom:5px}

/* CARDS */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px}
.card h3{margin:0 0 4px;font-size:19px;font-family:Newsreader,Georgia,serif;color:var(--navy);line-height:1.25}
.sub{color:var(--muted);font-size:14px;margin:0 0 10px}
.card ul{margin:10px 0 0;padding-left:18px;font-size:14.5px}
.card li{margin-bottom:5px}
.card p{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card);border:1px solid var(--line);padding:4px 13px;border-radius:999px;font-size:13.5px}
.chip.t{border-color:var(--accent);color:var(--brand);font-weight:500}
.sk h3{font-size:16px;color:var(--muted);font-weight:500;margin:24px 0 10px;font-family:Inter,sans-serif}
.sk h3:first-child{margin-top:0}
.ct a{display:inline}
.ct div{padding:8px 0;border-bottom:1px solid var(--line)}
.ct div:last-child{border:0}
footer{text-align:center;color:var(--muted);font-size:13px;padding:36px 20px calc(36px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn{transition:none}}
</style>
</head>
<body>
<nav id="nav"></nav>
<main id="app"></main>
<footer id="foot"></footer>

<script>
/* =====================================================================
   CARA EDIT: semua isi website ada di DATA ini.
   Ubah teks di dalam tanda kutip "..." lalu Commit changes.
   Jangan hapus koma (,) dan kurung [ ] { }.
   Mau nambah item? Copy satu blok { ... }, tempel di bawahnya, ubah isinya.
   ===================================================================== */
const DATA = {

  foto: "foto.jpg",   // upload foto ke folder yang sama dengan index.html, namanya foto.jpg (kalau tidak ada, muncul inisial)
  cv: "CV_QA_Maya_Dwi_Latifah_Monee.pdf",  // nama file CV di repo (harus persis sama). Kosongkan "" kalau tidak mau tombolnya muncul

  ],

  ],
  pengalaman: [
    { posisi: "Quality Assurance Engineer", perusahaan: "Tribun Network", periode: "Jul 2026 - Nov 2026", tentang: "Media berita regional dan nasional terbesar di Indonesia.", poin: [
      "Functional dan regression testing di Android dan iOS untuk Tribun X, memvalidasi alur penting sebelum dan sesudah rilis, termasuk beta testing sebelum rilis Play Store.",
      "Menguji Firebase Remote Config dan CMS backend, memastikan perubahan konfigurasi dan konten tampil benar di aplikasi.",

      "Merancang dan menjalankan 350+ test case terstruktur (positif, negatif, edge case) untuk UAT di website klien (Finance PT. CIMB Niaga): E2E, functional, dan regression di aplikasi mobile Android dan web.",

    ]}
  ],
  proyek: [
    { nama: "ERP Design of Sales Information System", info: "PT Surya Inti Aneka Pangan (SIAP) | Mata kuliah ERP", deskripsi: "Sistem ERP berbasis web untuk operasional penjualan.", poin: [

    { nama: "Historical Artifact Discovery Application", info: "Mata kuliah Website Service Technology", deskripsi: "Aplikasi web untuk menjelajahi artefak sejarah. Fokus QA pada kebutuhan fungsional dan pengalaman pengguna.", poin: [
      "Functional dan usability testing dengan test case manual.",
      "Mencatat progres testing dan defect, lalu menyelesaikannya bersama developer."
    ], tools: ["Postman","VS Code","FlutLab"], link: "" },
    { nama: "UX Research & UI/UX: Website Jual Beras (Agen Sri Rizki)", info: "Mata kuliah Interaksi Manusia dan Komputer", deskripsi: "Solusi web untuk mendigitalkan penjualan di toko beras tradisional di Cengkareng, Jakarta Barat.", poin: [
      "Wawancara dan survei user untuk menggali kebutuhan dan pain point.",

    ], tools: ["Figma","draw.io"], link: "" }
  ],
  skill: {
    "Testing": ["Manual Testing","Functional Testing","Regression Testing","UAT","SIT","API Testing (Postman)","Test Case Design","Test Planning","Bug Tracking & Reporting","STLC / SDLC","Agile/Scrum","Mobile Testing","Event Tracking Validation"],

    "Data & Lainnya": ["SQL","MySQL","Power BI","Looker Studio","Tableau","Google Colab","Figma","draw.io","JavaScript (basic)","HTML (basic)","Microsoft Office"]
  },
  sertifikat: [
    "IT Bootcamp Software Development (2024)"
  ],
  kursus: [
    "TOEFL, Universitas Bina Sarana Informatika (2026)",
    "Enterprise Resource Planning (ERP), PT Sumihai Teknologi Indonesia (2026)",
    "Program Analyst, BNSP (2026)",
    "Project/Product Management, MySkill (2025)",
    "UI/UX Design, Udemy (2025)",
    "Dasar Data Scientist, Dicoding (2024)",
    "Belajar Dasar SQL, Dicoding (2024)",
    "Mini Course Data Analyst, Revou (2024)"
  ],
  organisasi: { nama: "HIMSI (Himpunan Mahasiswa Sistem Informasi), Divisi Pendidikan | Sep 2022 - Sep 2023", poin: [
    "Mengelola kolaborasi internal dan eksternal untuk acara edukasi.",
    "Memberi briefing agenda acara ke stakeholder dan panitia dalam waktu satu minggu.",
    "Mendampingi peserta selama acara dengan arahan yang jelas."
  ]},
  kontak: [
    { label: "Email", teks: "mdwilatifah@gmail.com", url: "mailto:mdwilatifah@gmail.com" },
    { label: "LinkedIn", teks: "", url: "" },          // isi link LinkedIn kamu, misal "https://linkedin.com/in/namakamu"
    { label: "Instagram", teks: "@mayalatifah_", url: "https://instagram.com/mayalatifah_" },
    { label: "GitHub", teks: "", url: "" },            // isi kalau mau
    { label: "Telepon", teks: "085814717514", url: "tel:085814717514" }  // hapus baris ini kalau tidak mau nomor tampil publik
  ]
};

/* ====================== Bagian di bawah ini tidak perlu diubah ====================== */
const E = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ul = a => a && a.length ? `<ul>${a.map(x => `<li>${E(x)}</li>`).join("")}</ul>` : "";
const chips = (a, c = "") => a.map(x => `<span class="chip ${c}">${E(x)}</span>`).join("");
const D = DATA;
const ini = D.nama.split(" ").map(w => w[0]).slice(0, 2).join("");
const sec = (id, title, body) => `<section id="${id}"><h2>${title}</h2>${body}</section>`;

const html = [
  `<section class="hero" id="home">
    <img class="photo" src="${E(D.foto)}" alt="Foto ${E(D.nama)}" onerror="this.outerHTML='<div class=photo>${E(ini)}</div>'">
    <div class="txt"><h1>${E(D.nama)}</h1><div class="role">${E(D.peran)}</div>
    <p>${E(D.tentang[0])}</p>
    <div class="btns"><a class="btn" href="#proyek">Lihat proyek</a>${D.cv ? `<a class="btn o" href="${E(D.cv)}" download>Unduh CV</a>` : ""}<a class="btn o" href="#kontak">Hubungi saya</a></div></div>
  </section>`,
  sec("tentang", "Tentang saya", D.tentang.slice(1).map(p => `<p style="max-width:70ch">${E(p)}</p>`).join("") + `<div class="grid" style="margin-top:22px">${D.pendidikan.map(e => `<div class="card"><h3>${E(e.nama)}</h3><p class="sub">${E([e.detail, e.periode].filter(Boolean).join(" | "))}</p>${e.ekstra ? `<b>${E(e.ekstra)}</b>` : ""}</div>`).join("")}</div>`),
  sec("pengalaman", "Pengalaman", `<div class="tl">${D.pengalaman.map(x => `<div class="job"><h3>${E(x.posisi)}</h3><p class="co">${E(x.perusahaan)}</p><p class="when">${E(x.periode)}</p>${x.tentang ? `<p class="about">${E(x.tentang)}</p>` : ""}${ul(x.poin)}</div>`).join("")}</div>`),
  sec("proyek", "Proyek kuliah", `<div class="grid">${D.proyek.map(p => `<div class="card"><h3>${E(p.nama)}</h3>${p.info ? `<p class="sub">${E(p.info)}</p>` : ""}<p style="font-size:14.5px">${E(p.deskripsi)}</p>${ul(p.poin)}${p.tools.length ? `<div class="chips" style="margin-top:14px">${chips(p.tools, "t")}</div>` : ""}${p.link ? `<p style="margin-top:12px"><a href="${E(p.link)}" target="_blank" rel="noopener">Lihat dokumen proyek</a></p>` : ""}</div>`).join("")}</div>`),
  sec("skill", "Skill & tools", `<div class="sk">${Object.entries(D.skill).map(([k, v]) => `<h3>${E(k)}</h3><div class="chips">${chips(v)}</div>`).join("")}</div>`),
  sec("sertifikat", "Sertifikat, kursus & organisasi", `<div class="grid"><div class="card"><h3>Sertifikat</h3>${ul(D.sertifikat)}</div><div class="card"><h3>Kursus</h3>${ul(D.kursus)}</div><div class="card"><h3>Organisasi</h3><p class="sub">${E(D.organisasi.nama)}</p>${ul(D.organisasi.poin)}</div></div>`),
  sec("kontak", "Kontak", `<div class="card ct">${D.kontak.map(k => { const t = k.teks || k.url; return t ? `<div><b>${E(k.label)}:</b> ${k.url ? `<a href="${E(k.url)}" target="_blank" rel="noopener">${E(t)}</a>` : E(t)}</div>` : ""; }).join("")}</div>`)
].join("");

document.getElementById("app").innerHTML = html;
document.getElementById("nav").innerHTML = [["tentang","Tentang"],["pengalaman","Pengalaman"],["proyek","Proyek"],["skill","Skill"],["sertifikat","Sertifikat"],["kontak","Kontak"]].map(([i, t]) => `<a href="#${i}">${t}</a>`).join("");
document.getElementById("foot").textContent = "© " + new Date().getFullYear() + " " + D.nama;
document.title = D.nama + " | Portofolio";
</script>
</body>
</html>
